<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FullstackDevelopment Project Demo - Animation showcase">
  <meta name="keywords" content="fullstack development, project demo, animation">
  <meta name="author" content="Rubik">
  <title>FullstackDevelopment Project Demo</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .demo-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      text-align: center;
    }
    .demo-gif {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    .back-button {
      position: fixed;
      top: 74px;
      left: 20px;
      padding: 0.5rem 1rem;
      background-color: var(--bg-card);
      color: var(--text-secondary);
      text-decoration: none;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      font-size: 0.9rem;
      font-weight: 500;
      transition: color var(--transition-fast), border-color var(--transition-fast), background-color var(--transition-fast);
    }
    .back-button:hover {
      color: var(--accent);
      border-color: var(--accent);
      background-color: var(--accent-soft);
    }
  </style>
</head>
<body>
  <div id="nav-root"></div>
  <div class="container">
    <header>
      <h1><i class="fas fa-code"></i> FullstackDevelopment Demo</h1>
      <p class="subtitle">Project Animation Showcase</p>
    </header>
    
    <main>
      <a href="projects.html" class="back-button">
        <i class="fas fa-arrow-left"></i> Back to Projects
      </a>
      <div class="demo-container">
        <img src="images/Demos/Demo2.gif" alt="FullstackDevelopment Demo Animation" class="demo-gif">
      </div>
    </main>
    
  </div>
  <div id="footer-root"></div>

  <script src="js/components.js" defer></script>
</body>
</html>
