<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FullstackDevelopment Project Demo - Showcasing the project details and documentation">
  <meta name="keywords" content="fullstack development, project demo, documentation">
  <meta name="author" content="Rubik">
  <title>FullstackDevelopment Project Demo</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css">
  <style>
    .markdown-body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 980px;
      margin: 0 auto;
      padding: 45px;
    }
    .back-button {
      position: fixed;
      top: 20px;
      left: 20px;
      padding: 10px 20px;
      background-color: #333;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      z-index: 1000;
    }
    .back-button:hover {
      background-color: #555;
    }
    .project-info {
      background: #f6f8fa;
      border: 1px solid #e1e4e8;
      border-radius: 6px;
      padding: 20px;
      margin-bottom: 30px;
    }
    .project-info h2 {
      margin-top: 0;
    }
    .project-stats {
      display: flex;
      gap: 20px;
      margin: 15px 0;
    }
    .stat-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .repo-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: #2ea44f;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      margin-top: 10px;
    }
    .repo-link:hover {
      background: #2c974b;
    }
    .error-message {
      text-align: center;
      padding: 40px;
      color: #cf222e;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Main Navigation -->
    <nav id="main-nav">
      <a href="index.html" class="nav-btn"><i class="fas fa-home"></i> Home</a>
      <a href="workshop.html" class="nav-btn"><i class="fas fa-tools"></i> Workshop</a>
      <a href="articles.html" class="nav-btn"><i class="fas fa-newspaper"></i> Articles</a>
    </nav>
    
    <header>
      <h1><i class="fas fa-code"></i> FullstackDevelopment Project</h1>
      <p class="subtitle">Project Documentation and Details</p>
    </header>
    
    <main>
      <a href="projects.html" class="back-button">
        <i class="fas fa-arrow-left"></i> Back to Projects
      </a>
      <div id="project-content" class="markdown-body">
        <div class="loading-indicator">
          <i class="fas fa-spinner fa-spin"></i> Loading project information...
        </div>
      </div>
    </main>
    
    <footer>
      <h3>Let's Connect</h3>
      <div class="social-links">
        <a href="https://www.linkedin.com/in/ru8ik/" target="_blank" title="LinkedIn Profile">
          <i class="fab fa-linkedin fa-2x"></i>
        </a>
        <a href="https://github.com/ru8ik" target="_blank" title="GitHub Profile">
          <i class="fab fa-github fa-2x"></i>
        </a>
      </div>
      <p class="copyright">&copy; <span id="current-year"></span> Rubik's Digital Workshop. All rights reserved.</p>
    </footer>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Set current year in copyright
      const currentYearElement = document.getElementById('current-year');
      if (currentYearElement) {
        currentYearElement.textContent = new Date().getFullYear();
      }

      const projectContent = document.getElementById('project-content');

      // Fetch repository information
      fetch('https://api.github.com/repos/ru8ik/FullstackDevelopment')
        .then(response => {
          if (!response.ok) {
            throw new Error('Network response was not ok');
          }
          return response.json();
        })
        .then(repo => {
          // Format date
          const updatedDate = new Date(repo.updated_at);
          const formattedDate = updatedDate.toLocaleDateString('en-US', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
          });

          // Create project info section
          const projectInfo = document.createElement('div');
          projectInfo.className = 'project-info';
          projectInfo.innerHTML = `
            <h2>${repo.name}</h2>
            <p>${repo.description || 'No description available.'}</p>
            <div class="project-stats">
              <div class="stat-item">
                <i class="fas fa-star"></i>
                <span>${repo.stargazers_count} Stars</span>
              </div>
              <div class="stat-item">
                <i class="fas fa-code-branch"></i>
                <span>${repo.forks_count} Forks</span>
              </div>
              <div class="stat-item">
                <i class="fas fa-calendar-alt"></i>
                <span>Updated: ${formattedDate}</span>
              </div>
            </div>
            <a href="${repo.html_url}" target="_blank" class="repo-link">
              <i class="fab fa-github"></i>
              View on GitHub
            </a>
          `;

          // Replace loading indicator with project info
          projectContent.innerHTML = '';
          projectContent.appendChild(projectInfo);

          // Now fetch the README content
          return fetch(`https://api.github.com/repos/ru8ik/FullstackDevelopment/contents/README.md`);
        })
        .then(response => {
          if (!response.ok) {
            throw new Error('README not found');
          }
          return response.json();
        })
        .then(data => {
          // Decode base64 content
          const content = atob(data.content);
          
          // Create README section
          const readmeSection = document.createElement('div');
          readmeSection.className = 'readme-section';
          
          // Convert markdown to HTML using marked.js
          if (window.marked) {
            readmeSection.innerHTML = marked.parse(content);
          } else {
            readmeSection.innerHTML = `<pre>${content}</pre>`;
          }
          
          // Append README after project info
          projectContent.appendChild(readmeSection);
        })
        .catch(error => {
          console.error('Error:', error);
          projectContent.innerHTML = `
            <div class="error-message">
              <i class="fas fa-exclamation-triangle"></i>
              <p>Sorry, there was an error loading the project information. Please try again later.</p>
              <small>${error.message}</small>
            </div>
          `;
        });
    });
  </script>
  
  <!-- Include marked.js for markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</body>
</html>
