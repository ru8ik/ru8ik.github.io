<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Projects</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* Basic styling for your projects page */
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: 'Roboto', sans-serif;
      padding: 20px;
    }
    .project {
      background-color: #1e1e1e;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }
    .project h2 {
      margin-bottom: 10px;
    }
    .btn {
      display: inline-block;
      padding: 12px 25px;
      font-size: 1em;
      font-weight: 500;
      color: #e0e0e0;
      background-color: transparent;
      border: 2px solid #e0e0e0;
      border-radius: 4px;
      text-decoration: none;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .btn:hover {
      background-color: #e0e0e0;
      color: #121212;
    }
  </style>
</head>
<body>
  <div class="project" id="ant-table-app">
    <h2>Ant Table App</h2>
    <p>This is a React-based web application showcasing interactive tables.</p>
    <!-- Button to open the React app -->
    <a href="https://ru8ik.github.io/ant-table-app" target="_blank" class="btn">
      Open Ant Table App
    </a>
  </div>
</body>
</html>
