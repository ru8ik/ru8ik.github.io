<script>
  // Define an array of repository names you want to display
  const selectedRepos = ["ant-table-app", "another-repo", "yet-another-repo"];
  
  // Fetch all public repositories for the user
  fetch('https://api.github.com/users/ru8ik/repos')
    .then(response => response.json())
    .then(repos => {
      const projectsList = document.getElementById('projects-list');
      repos.forEach(repo => {
        // Only display the repository if its name is in the selectedRepos array
        if (!selectedRepos.includes(repo.name)) return;
        
        const projectDiv = document.createElement('div');
        projectDiv.className = 'project';
        
        // Special handling for ant-table-app to add an extra button
        if (repo.name === 'ant-table-app') {
          projectDiv.innerHTML = `
            <h3>${repo.name}</h3>
            <p>${repo.description ? repo.description : 'No description available.'}</p>
            <a href="${repo.html_url}" target="_blank">View Repository</a>
            <br>
            <a href="https://ru8ik.github.io/ant-table-app" target="_blank" class="btn">Open Live App</a>
          `;
        } else {
          projectDiv.innerHTML = `
            <h3>${repo.name}</h3>
            <p>${repo.description ? repo.description : 'No description available.'}</p>
            <a href="${repo.html_url}" target="_blank">View Repository</a>
          `;
        }
        projectsList.appendChild(projectDiv);
      });
    })
    .catch(error => {
      console.error('Error fetching repositories:', error);
    });
</script>
