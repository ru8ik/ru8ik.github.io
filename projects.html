<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio - Projects</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <!-- Back to Home Button -->
    <div id="back-nav">
      <a href="index.html" class="btn">Back to Home</a>
    </div>
    <!-- Header -->
    <header>
      <h1>My Projects</h1>
    </header>
    <!-- Projects List Section -->
    <section id="projects-list">
      <!-- Projects will be dynamically inserted here -->
    </section>
  </div>
  
  <!-- Script to fetch and display selected GitHub projects -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Define an array of repository names you want to display
      const selectedRepos = ["ant-table-app", "api-PyArrow-case-study-sec-gov"];
      
      const projectsList = document.getElementById('projects-list');
      if (!projectsList) {
        console.error('Element with id "projects-list" not found.');
        return;
      }
      
      // Fetch all public repositories for the user
      fetch('https://api.github.com/users/ru8ik/repos')
        .then(response => response.json())
        .then(repos => {
          repos.forEach(repo => {
            // Only display the repository if its name is in the selectedRepos array
            if (!selectedRepos.includes(repo.name)) return;
            
            const projectDiv = document.createElement('div');
            projectDiv.className = 'project';
            
            // Special handling for ant-table-app to add an extra button
            if (repo.name === 'ant-table-app') {
              projectDiv.innerHTML = `
                <h3>${repo.name}</h3>
                <p>${repo.description ? repo.description : 'No description available.'}</p>
                <a href="${repo.html_url}" target="_blank">View Repository</a>
                <br>
                <a href="https://ru8ik.github.io/ant-table-app" target="_blank" class="btn">Open Live App</a>
              `;
            } else {
              projectDiv.innerHTML = `
                <h3>${repo.name}</h3>
                <p>${repo.description ? repo.description : 'No description available.'}</p>
                <a href="${repo.html_url}" target="_blank">View Repository</a>
              `;
            }
            projectsList.appendChild(projectDiv);
          });
        })
        .catch(error => {
          console.error('Error fetching repositories:', error);
        });
    });
  </script>
</body>
</html>
