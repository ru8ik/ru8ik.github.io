<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PaddlePong — Rubik Seviyants</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/nav.css">
  <link rel="stylesheet" href="../css/games.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div id="nav-root"></div>

  <div class="container">
    <header>
      <h1>PaddlePong</h1>
    </header>
    <main>
      <div class="game-wrapper">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
      </div>
    </main>
  </div>

  <div id="footer-root"></div>

  <script>

        var canvas;
        var canvasContext;
        var ballX = 50;
        var ballY = 50;
        var ballSpeedX = 9;
        var ballSpeedY = 4;

        var player1Score =0;
        var player2Score =0;
        const WINNING_SCORE = 3;

        var showingWinScreen = false;

        var paddle1Y = 250;
        var paddle2Y = 250;
        const PADDLE_HEIGHT = 100;
        const PADDLE_THICKNESS = 10;

        function calculateMousePos(evt){
            var rect = canvas.getBoundingClientRect();
            var root = document.documentElement;
            var mouseX = evt.clientX - rect.left - root.scrollLeft;
            var mouseY = evt.clientY - rect.top - root.scrollTop;
            return {
                x:mouseX,
                y:mouseY

            };
        }

        function handleMouseClick(evt){
            if (showingWinScreen){
                player1Score = 0;
                player2Score = 0;
                showingWinScreen = false;
            }
        }
        window.onload = function(){
            canvas = document.getElementById('gameCanvas');
            canvasContext = canvas.getContext('2d');
     /*first 2 numbers are location, last 2 numbers are size   */
            /* the location starts on LEFT HIGH corrner  */
            var framesPerSecond = 40;
            setInterval(function(){
                                   moveEverything();
                                   drawEverything();
                                   }
            , 1000/framesPerSecond);

            canvas.addEventListener('mousedown',handleMouseClick);

            canvas.addEventListener('mousemove', function(evt){
                                                  var mousePos = calculateMousePos(evt);
                                                  paddle1Y = mousePos.y-(PADDLE_HEIGHT/2);
            });
        }




        function ballReset(){
            if (player1Score >= WINNING_SCORE || player2Score >= WINNING_SCORE){
                //player1Score = 0;
                //player2Score = 0;
                showingWinScreen = true;
            }

            ballSpeedX = -ballSpeedX;
            ballX = canvas.width/2;
            ballY = canvas.height/2;
        }

        function computerMovment(){
            var paddle2YCenter = paddle2Y + (PADDLE_HEIGHT/2);
             if (paddle2YCenter < ballY - 35){
                 paddle2Y += 6;
             }else if (paddle2YCenter > ballY + 35){
                 paddle2Y -= 6;
             }
        }


    function moveEverything(){
        if(showingWinScreen){
            return;
        }
        computerMovment();
        ballX += ballSpeedX;
        ballY += ballSpeedY;

        //ball hit left wall
          if( ballX < 0 ){
              if(ballY > paddle1Y &&
                 ballY < paddle1Y + PADDLE_HEIGHT){
                 ballSpeedX = -ballSpeedX;
                 // Ball control - as more you go far from the center of the paddle the ball change to more stiper angle
                var deltaY = ballY - (paddle1Y+PADDLE_HEIGHT/2);
                  // increase the speed of the ball relaing on the deltaY
                  ballSpeedY = deltaY * 0.35;


              }else{
                  player2Score += 1; // most be BEFORE ballReset()
                  ballReset();

              }
        }

        // ball hit right wall
        if( ballX > canvas.width ){
                 if(ballY > paddle2Y &&
                 ballY < paddle2Y + PADDLE_HEIGHT){
                 ballSpeedX = -ballSpeedX;
                      // Ball control - as more you go far from the center of the paddle the ball change to more stiper angle
                var deltaY = ballY - (paddle2Y+PADDLE_HEIGHT/2);
                  // increase the speed of the ball relaing on the deltaY
                  ballSpeedY = deltaY * 0.35;
              }else{
                  player1Score += 1; // most be BEFORE ballReset()
                  ballReset();

              }
        }

        //for Y axis
             if( ballY < 0 ){
            ballSpeedY = -ballSpeedY;
        }

        if( ballY > canvas.height ){
            ballSpeedY = -ballSpeedY;
        }
    }


    function drawNet(){
        for (var i=0; i<canvas.height; i+=40){
        colorRect(canvas.width/2-1,i,2,20, 'white');
        }
    }


    function drawEverything(){

        //console.log(ballX);
        //next line blanks out the screen with black
        colorRect(0, 0, canvas.width, canvas.height, 'black');

         if(showingWinScreen){
             canvasContext.fillStyle = 'white';
                 if (player1Score >= WINNING_SCORE){
                     canvasContext.fillText("You win! Click to play again", 400, 400, );
              }else if (player2Score >= WINNING_SCORE){
                     canvasContext.fillText("Computer wins! Click to play again", 400, 400, );
              }
            canvasContext.fillStyle = 'white';
            canvasContext.fillText("Click anywhere to play again", 400, 500, );
            return;
        }

        drawNet();

        //this is LEFT player paddle
        colorRect(0, paddle1Y, PADDLE_THICKNESS, PADDLE_HEIGHT, 'white');


        //this is RIGHT PC player paddle
        colorRect(canvas.width - PADDLE_THICKNESS, paddle2Y, PADDLE_THICKNESS, PADDLE_HEIGHT, 'white');


        //this draws the ball
        colorCircle(ballX, ballY, 10, 'white');

        //Score print
        canvasContext.fillText(player1Score, 100, 100, );
        canvasContext.fillText(player2Score, canvas.width-100, 100 );



    }


    function colorCircle(centerX, CenterY, radius, drawColor){
       canvasContext.fillStyle = drawColor;
       canvasContext.beginPath();
       canvasContext.arc(centerX, CenterY, radius, 0, Math.PI*2, true);
       canvasContext.fill();
    }


    function colorRect(leftX, topY, width, height, drawColor){
        canvasContext.fillStyle = drawColor;
        canvasContext.fillRect(leftX, topY, width, height);
    }

    </script>

  <script src="../js/components.js" defer></script>
</body>
</html>
