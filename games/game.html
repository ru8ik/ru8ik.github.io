<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Memory Card Game - Test your memory by matching pairs of cards">
  <meta name="keywords" content="memory game, card game, browser game">
  <meta name="author" content="Rubik">
  <title>Memory Card Game</title>
  <link rel="stylesheet" href="../css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .game-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    
    .game-board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-top: 30px;
    }
    
    .card {
      height: 120px;
      background-color: #8e44ad;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.3s ease;
      transform-style: preserve-3d;
      position: relative;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }
    
    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
    }
    
    .card.flipped {
      transform: rotateY(180deg);
    }
    
    .card.matched {
      background-color: #27ae60;
      cursor: default;
    }
    
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 8px;
    }
    
    .card-front {
      background-color: #8e44ad;
      transform: rotateY(0deg);
    }
    
    .card-back {
      background-color: #2d2d2d;
      transform: rotateY(180deg);
    }
    
    .card-back i {
      font-size: 2.5em;
      color: #fff;
    }
    
    .game-info {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      padding: 15px;
      background-color: #252525;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    
    .game-info div {
      font-size: 1.2em;
    }
    
    .reset-btn {
      display: inline-block;
      padding: 10px 20px;
      background-color: #8e44ad;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1em;
      transition: all 0.3s ease;
      margin-top: 20px;
    }
    
    .reset-btn:hover {
      background-color: #9b59b6;
      transform: translateY(-2px);
    }
    
    .win-message {
      text-align: center;
      margin-top: 20px;
      padding: 15px;
      background-color: #27ae60;
      color: white;
      border-radius: 8px;
      font-size: 1.3em;
      display: none;
    }
    
    @media (max-width: 600px) {
      .game-board {
        grid-template-columns: repeat(3, 1fr);
      }
      
      .card {
        height: 100px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Main Navigation -->
    <nav id="main-nav">
      <a href="../index.html" class="nav-btn"><i class="fas fa-home"></i> Home</a>
      <a href="index.html" class="nav-btn"><i class="fas fa-gamepad"></i> Games</a>
      <a href="../projects.html" class="nav-btn"><i class="fas fa-code"></i> Projects</a>
    </nav>
    
    <header>
      <h1><i class="fas fa-brain"></i> Memory Card Game</h1>
      <p class="subtitle">Test your memory by matching pairs of cards</p>
    </header>
    
    <main>
      <div class="game-container">
        <p>Flip cards to find matching pairs. Match all pairs to win!</p>
        
        <div class="game-info">
          <div>Moves: <span id="moves">0</span></div>
          <div>Pairs Found: <span id="pairs">0</span> / 8</div>
        </div>
        
        <div class="game-board" id="game-board">
          <!-- Cards will be dynamically inserted here -->
        </div>
        
        <div class="win-message" id="win-message">
          <i class="fas fa-trophy"></i> Congratulations! You've found all pairs in <span id="final-moves">0</span> moves!
        </div>
        
        <button class="reset-btn" id="reset-btn">Reset Game</button>
      </div>
    </main>
    
    <footer>
      <h3>Let's Connect</h3>
      <div class="social-links">
        <a href="https://www.linkedin.com/in/ru8ik/" target="_blank" title="LinkedIn Profile">
          <i class="fab fa-linkedin fa-2x"></i>
        </a>
        <a href="https://github.com/ru8ik" target="_blank" title="GitHub Profile">
          <i class="fab fa-github fa-2x"></i>
        </a>
      </div>
      <p class="copyright">&copy; <span id="current-year"></span> Rubik's Digital Workshop. All rights reserved.</p>
    </footer>
  </div>
  
  <!-- Back to Top Button -->
  <button id="back-to-top" title="Back to Top"><i class="fas fa-arrow-up"></i></button>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Set current year in copyright
      document.getElementById('current-year').textContent = new Date().getFullYear();
      
      // Game variables
      const gameBoard = document.getElementById('game-board');
      const movesDisplay = document.getElementById('moves');
      const pairsDisplay = document.getElementById('pairs');
      const resetBtn = document.getElementById('reset-btn');
      const winMessage = document.getElementById('win-message');
      const finalMovesDisplay = document.getElementById('final-moves');
      
      let cards = [];
      let flippedCards = [];
      let moves = 0;
      let pairsFound = 0;
      let canFlip = true;
      
      // Card icons (Font Awesome)
      const icons = [
        'fa-heart', 'fa-star', 'fa-bell', 'fa-gem',
        'fa-moon', 'fa-sun', 'fa-bolt', 'fa-cloud'
      ];
      
      // Initialize game
      function initGame() {
        // Reset variables
        cards = [];
        flippedCards = [];
        moves = 0;
        pairsFound = 0;
        canFlip = true;
        
        // Update displays
        movesDisplay.textContent = moves;
        pairsDisplay.textContent = pairsFound;
        winMessage.style.display = 'none';
        
        // Clear game board
        gameBoard.innerHTML = '';
        
        // Create card pairs
        const cardPairs = [...icons, ...icons];
        
        // Shuffle cards
        const shuffledCards = shuffleArray(cardPairs);
        
        // Create card elements
        shuffledCards.forEach((icon, index) => {
          const card = document.createElement('div');
          card.className = 'card';
          card.dataset.cardIndex = index;
          card.dataset.icon = icon;
          
          card.innerHTML = `
            <div class="card-front"></div>
            <div class="card-back">
              <i class="fas ${icon}"></i>
            </div>
          `;
          
          card.addEventListener('click', flipCard);
          gameBoard.appendChild(card);
          cards.push(card);
        });
      }
      
      // Shuffle array (Fisher-Yates algorithm)
      function shuffleArray(array) {
        const newArray = [...array];
        for (let i = newArray.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
        }
        return newArray;
      }
      
      // Flip card
      function flipCard() {
        if (!canFlip || this.classList.contains('flipped') || this.classList.contains('matched')) {
          return;
        }
        
        this.classList.add('flipped');
        flippedCards.push(this);
        
        if (flippedCards.length === 2) {
          moves++;
          movesDisplay.textContent = moves;
          canFlip = false;
          
          // Check for match
          if (flippedCards[0].dataset.icon === flippedCards[1].dataset.icon) {
            // Match found
            flippedCards.forEach(card => {
              card.classList.add('matched');
            });
            flippedCards = [];
            pairsFound++;
            pairsDisplay.textContent = pairsFound;
            canFlip = true;
            
            // Check for win
            if (pairsFound === icons.length) {
              finalMovesDisplay.textContent = moves;
              winMessage.style.display = 'block';
            }
          } else {
            // No match
            setTimeout(() => {
              flippedCards.forEach(card => {
                card.classList.remove('flipped');
              });
              flippedCards = [];
              canFlip = true;
            }, 1000);
          }
        }
      }
      
      // Reset game
      resetBtn.addEventListener('click', initGame);
      
      // Back to Top button functionality
      const backToTopButton = document.getElementById('back-to-top');
      
      // Show/hide button based on scroll position
      window.addEventListener('scroll', function() {
        if (window.pageYOffset > 300) {
          backToTopButton.classList.add('visible');
        } else {
          backToTopButton.classList.remove('visible');
        }
      });
      
      // Scroll to top when button is clicked
      backToTopButton.addEventListener('click', function() {
        window.scrollTo({
          top: 0,
          behavior: 'smooth'
        });
      });
      
      // Initialize game on load
      initGame();
    });
  </script>
</body>
</html>
