<body>
  <div id="nav-root"></div>

  <div class="container">
    <header>
      <h1>Break Brick</h1>
    </header>
    <main>
      <div class="game-wrapper">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
      </div>
    </main>
  </div>

  <div id="footer-root"></div>

<script>
    var ballX = 75;
    var ballY = 75;
    var ballSpeedX = 5;
    //ballSpeedY if increased causes a bug on the paddle (after 1 miss the paddle becomes "transparent")
    var ballSpeedY = 6;

    const BRICK_W = 100;
    const BRICK_H = 50;
    const BRICK_COUNT = 8;
    var brickGrid = new Array(BRICK_COUNT);

    const PADDLE_WIDTH = 100;
    const PADDLE_THICKNESS = 10;
    const PADDLE_DIST_FROM_EDGE =60;
    var paddleX = 400;

    var canvas;
    var canvasContext;

    var mouseX = 0;
    var mouseY = 0;

    function updateMousePos(evt){
        //get the position on the page of our canvas
        var rect = canvas.getBoundingClientRect();
        var root = document.documentElement;

        // (evt) belongs to the addEventListener that takes the mouse horizontal position from the client
         mouseX = evt.clientX - rect.left - root.scrollLeft;
         mouseY = evt.clientY - rect.top - root.scrollTop;

        //center the paddle on the mouse position
        paddleX = mouseX-PADDLE_WIDTH/2;
    }


    function brickReset(){
     for(var i=0; i<BRICK_COUNT; i++){
       if(Math.random() <0.5){
        brickGrid[i] = true;
        }else{
            brickGrid[i] =false;
  }// endof else (random check)
 }//end of FOR each brick
}//end of brickReset function

    window.onload = function() {
        canvas = document.getElementById('gameCanvas');
        canvasContext = canvas.getContext('2d');

        var framesPerSecond = 30;
        //the refresh rate of function updateAll() will be 1000 milliseconds / 30 = 33.3 frames per second
        setInterval(updateAll, 1000/framesPerSecond);

        canvas.addEventListener('mousemove', updateMousePos);

        brickReset();

    }



    function updateAll(){
        moveAll();
        drawAll();
    }

    function ballReset(){
        ballX = canvas.width/2;
        ballY = canvas.height/2;

    }

    function moveAll(){

        //console.log(ballX);
        ballX  += ballSpeedX;
        //console.log(ballY);
        ballY  += ballSpeedY;

        //for ballX
        if(ballX < 0){ //Left
            ballSpeedX *= -1;
        }

        if(ballX > canvas.width){ //Right
            //multiply the speed by -1 to change the direction of the ball
            ballSpeedX *= -1;
        }

        //for ballY
        if(ballY < 0){ //Top edge
            ballSpeedY *= -1;
        }

        if(ballY > canvas.height){ //Bottom
            //multiply the speed by -1 to change the direction of the ball
            ballReset();
        }

        var paddleTopEdgeY = canvas.height - PADDLE_DIST_FROM_EDGE;
        var paddleBottomEdgeY = paddleTopEdgeY + PADDLE_THICKNESS;
        var paddleLeftEdgeX = paddleX;
        var paddleRightEdgeX = paddleLeftEdgeX + PADDLE_WIDTH;
        if (ballY > paddleTopEdgeY && // Below the top of paddle
            ballY < paddleBottomEdgeY && // Above bottom of the paddle
            ballX > paddleLeftEdgeX && // Right of the left side of paddle
            ballX < paddleRightEdgeX){ // Left of the right side of paddle
        //negative send the ball UP
            ballSpeedY *= -1;

            var centerOfPaddleX = paddleX + PADDLE_WIDTH/2;
            var ballDistFromPaddleCenterX = ballX - centerOfPaddleX;

            ballSpeedX = ballDistFromPaddleCenterX * 0.35;
        }
    }




    function drawBricks(){
        for(var i = 0; i<BRICK_COUNT; i++){
            if(brickGrid[i]){
                colorRect(BRICK_W*i,0, BRICK_W - 2,BRICK_H, 'green'  )
            }//end of is this brick here
        }//end of FOR each brick
    }// end of drawBricks function



    function drawAll(){
        //fill the canvas each frame so the ball appears to move instead of being drawn repeatedly
        colorRect(0, 0, canvas.width, canvas.height, 'black');

        //ball variable movement — draw ball
        colorCircle(ballX,ballY, 10,  'red');

        //paddle
        colorRect(paddleX, canvas.height-PADDLE_DIST_FROM_EDGE,
                  PADDLE_WIDTH,PADDLE_THICKNESS,  'blue');

        drawBricks();

    }


    function colorRect(topLeftX,topLeftY, boxWidth,boxHeight, fillColor ){
        //fill the canvas each frame so the ball appears to move instead of being drawn repeatedly
        canvasContext.fillStyle = fillColor;
        canvasContext.fillRect(topLeftX,topLeftY,  boxWidth,boxHeight);
    }


    function colorCircle(centerX,centerY, radius,  fillColor){
        canvasContext.fillStyle = fillColor;
        canvasContext.beginPath();
        canvasContext.arc(centerX,centerY, 10, 0,Math.PI*2, true);
        canvasContext.fill();
    }


    function colorText(showWords, textX,textY, fillColor){
        canvasContext.fillStyle = fillColor;
        canvasContext.fillText(showWords, textX,textY);
    }


</script>

  <script src="../js/components.js" defer></script>
